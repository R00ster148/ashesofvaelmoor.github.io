<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashes of Vaelmoor Launcher</title>
<meta name="description" content="Choose a build of Ashes of Vaelmoor to play.">

<!--
  HOW TO ADD A NEW VERSION
  =========================
  1. Drop your game file into the /versions/ folder of this repo.
  2. Name it ashes-of-vaelmoor_20.html (the next number up from your
     highest existing one). The plain "ashes-of-vaelmoor.html" is treated
     as the oldest build and always sorts to the bottom.
  3. Commit + push. This page reads the folder live from GitHub every time
     it loads, so the new build just appears in the list, sorted above
     older versions automatically. No manifest file to maintain.
-->

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;700&display=swap');

:root{
  --bg:#15110f;
  --bg-deep:#0f0c0a;
  --panel:#221c18;
  --panel-light:#2b231e;
  --border:#473a30;
  --text:#ddd0bc;
  --text-dim:#9a8a76;
  --ember:#cf5b2e;
  --ember-glow:rgba(207,91,46,0.35);
  --gold:#c79a47;
  --blood:#8a3232;
  --parchment:#e8dcc0;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  background:radial-gradient(ellipse at 50% -10%, #241a14 0%, var(--bg-deep) 60%);
  color:var(--text);
  font-family:'EB Garamond', serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

h1,h2,.label,.btn,.title{ font-family:'Cinzel', serif; }
.mono{ font-family:'JetBrains Mono', monospace; }

.header{
  padding:22px 28px 16px;
  border-bottom:1px solid var(--border);
  flex:0 0 auto;
}
.header h1{
  margin:0;
  font-size:22px;
  letter-spacing:0.06em;
  color:var(--gold);
  text-shadow:0 0 18px var(--ember-glow);
}
.header .subtitle{
  margin:6px 0 0;
  font-size:13px;
  color:var(--text-dim);
  letter-spacing:0.03em;
}

.status-banner{
  margin:12px 28px 0;
  padding:9px 14px;
  border-radius:4px;
  border:1px solid var(--border);
  background:var(--panel);
  font-size:12.5px;
  color:var(--text-dim);
  display:none;
}
.status-banner.show{ display:block; }
.status-banner.error{ border-color:var(--blood); color:#e2a5a5; }

.list{
  flex:1 1 auto;
  padding:16px 28px 24px;
  display:flex;
  flex-direction:column;
  gap:10px;
  max-width:720px;
  width:100%;
  margin:0 auto;
}

.version-row{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:4px;
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  transition:border-color 0.15s ease;
}
.version-row:hover{ border-color:var(--ember); }
.version-row.latest{ border-color:var(--gold); box-shadow:0 0 10px rgba(199,154,71,0.18) inset; }

.version-info{ display:flex; align-items:baseline; gap:10px; min-width:0; }
.version-num{
  font-family:'Cinzel',serif;
  font-size:15px;
  color:var(--text);
  letter-spacing:0.03em;
}
.version-tag{
  font-size:9.5px;
  text-transform:uppercase;
  letter-spacing:0.08em;
  color:var(--bg-deep);
  background:var(--gold);
  padding:2px 7px;
  border-radius:8px;
  flex:0 0 auto;
}
.version-tag.build{ background:var(--panel-light); color:var(--text-dim); border:1px solid var(--border); }

.btn{
  border:1px solid var(--border);
  background:var(--panel-light);
  color:var(--text);
  padding:7px 18px;
  border-radius:3px;
  font-size:12.5px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  cursor:pointer;
  text-decoration:none;
  flex:0 0 auto;
  transition:all 0.15s ease;
  display:inline-block;
}
.btn:hover{ border-color:var(--ember); color:var(--parchment); }
.btn.play{ border-color:var(--gold); color:var(--gold); }
.btn.play:hover{ background:var(--gold); color:var(--bg-deep); }

.footer{
  flex:0 0 auto;
  padding:10px 28px 16px;
  border-top:1px solid var(--border);
  font-size:11px;
  color:var(--text-dim);
  display:flex;
  justify-content:space-between;
  max-width:720px;
  width:100%;
  margin:0 auto;
}
.footer a{ color:var(--text-dim); text-decoration:none; }
.footer a:hover{ color:var(--gold); }
.footer-links{ display:flex; align-items:center; gap:8px; }
.footer-sep{ color:var(--border); }

.empty-state{
  text-align:center;
  padding:40px 20px;
  color:var(--text-dim);
  font-size:13px;
}

#emberCanvas{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}
.header, .status-banner, .list, .footer{
  position:relative;
  z-index:1;
}
</style>
</head>
<body>

<canvas id="emberCanvas"></canvas>

<div class="header">
  <h1>Ashes of Vaelmoor</h1>
  <div class="subtitle">Launcher &mdash; select a version to play</div>
</div>

<div class="status-banner" id="statusBanner"></div>

<div class="list" id="versionList">
  <div class="empty-state">Loading version list&hellip;</div>
</div>

<div class="footer">
  <div class="footer-links">
    <a href="https://discord.gg/qJKYaaUnnw" class="footer-link">Discord</a>
    <span class="footer-sep">&middot;</span>
    <a href="https://www.speedrun.com/Ashes_of_Vaelmoor" class="footer-link">Speedrun.com</a>
  </div>
  <a href="#" id="refreshLink">Refresh list</a>
</div>

<script>
(function(){
  // Ambient ember particle drift - purely decorative, matches the game's
  // own color palette.
  var canvas = document.getElementById('emberCanvas');
  var ctx = canvas.getContext('2d');
  function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();

  var embers = [];
  var maxEmbers = 35;
  function spawnEmber(fromBottom){
    return {
      x: Math.random() * canvas.width,
      y: fromBottom ? canvas.height + 10 : Math.random() * canvas.height,
      r: 1 + Math.random() * 2.2,
      speed: 0.25 + Math.random() * 0.6,
      drift: (Math.random() - 0.5) * 0.35,
      alpha: 0.25 + Math.random() * 0.45,
      flicker: Math.random() * Math.PI * 2
    };
  }
  for (var i = 0; i < maxEmbers; i++) embers.push(spawnEmber(false));

  function tick(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = 0; i < embers.length; i++) {
      var e = embers[i];
      e.y -= e.speed;
      e.x += e.drift;
      e.flicker += 0.04;
      if (e.y < -10) { embers[i] = spawnEmber(true); continue; }
      var flick = 0.7 + 0.3 * Math.sin(e.flicker);
      var grad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r * 3);
      grad.addColorStop(0, 'rgba(207,91,46,' + (e.alpha * flick) + ')');
      grad.addColorStop(1, 'rgba(207,91,46,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r * 3, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

// ============================ CONFIG ============================
// Adjust these if your repo owner/name/branch ever change.
var OWNER = 'r00ster148';
var REPO = 'ashesofvaelmoor.github.io';
var BRANCH = 'main';      // change to 'master' if that's your default branch
var FOLDER = 'versions';  // folder holding the version files

// Matches: ashes-of-vaelmoor.html (the original, oldest build)
//          ashes-of-vaelmoor_1.html, ashes-of-vaelmoor_2.html, ... ashes-of-vaelmoor_19.html
var FILE_PATTERN = /^ashes-of-vaelmoor(?:_(\d+))?\.html$/i;
// ==================================================================

var listEl = document.getElementById('versionList');
var bannerEl = document.getElementById('statusBanner');

function showStatus(msg, isError) {
  bannerEl.textContent = msg;
  bannerEl.className = 'status-banner show' + (isError ? ' error' : '');
}
function hideStatus() {
  bannerEl.className = 'status-banner';
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

var builds = []; // { file, order, label }

function render() {
  if (builds.length === 0) {
    listEl.innerHTML = '<div class="empty-state">No versions available.</div>';
    return;
  }

  var html = '';
  builds.forEach(function(b, idx) {
    var isLatest = idx === 0;
    html += '<div class="version-row' + (isLatest ? ' latest' : '') + '">';
    html += '  <div class="version-info">';
    html += '    <span class="version-num">' + escapeHtml(b.label) + '</span>';
    if (isLatest) html += '    <span class="version-tag">Latest</span>';
    html += '  </div>';
    html += '  <a class="btn play" href="./' + FOLDER + '/' + encodeURIComponent(b.file) + '">Play</a>';
    html += '</div>';
  });
  listEl.innerHTML = html;
}

function loadVersions() {
  hideStatus();
  listEl.innerHTML = '<div class="empty-state">Loading version list&hellip;</div>';

  var apiUrl = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + FOLDER + '?ref=' + BRANCH;

  fetch(apiUrl, { headers: { 'Accept': 'application/vnd.github+json' } })
    .then(function(res) {
      if (!res.ok) {
        if (res.status === 404) {
          throw new Error('No "' + FOLDER + '/" folder found yet in the repo.');
        }
        if (res.status === 403) {
          throw new Error('GitHub API rate limit hit - wait a bit and try again.');
        }
        throw new Error('GitHub API returned ' + res.status + '.');
      }
      return res.json();
    })
    .then(function(files) {
      builds = files
        .filter(function(f) { return f.type === 'file'; })
        .map(function(f) {
          var m = f.name.match(FILE_PATTERN);
          if (!m) return null;
          var num = m[1] ? parseInt(m[1], 10) : 0; // no number = the original, oldest build
          var label = m[1] ? ('v' + m[1]) : 'Original';
          return { file: f.name, order: num, label: label };
        })
        .filter(Boolean)
        .sort(function(a, b) { return b.order - a.order; }); // highest number first (newest)

      if (builds.length === 0) {
        listEl.innerHTML = '<div class="empty-state">No builds found in /' + FOLDER + '/.</div>';
        return;
      }
      render();
    })
    .catch(function(err) {
      showStatus('Could not load the version list: ' + err.message, true);
      listEl.innerHTML = '<div class="empty-state">Could not load version list.</div>';
    });
}

document.getElementById('refreshLink').addEventListener('click', function(e) {
  e.preventDefault();
  loadVersions();
});

loadVersions();
</script>
</body>
</html>
